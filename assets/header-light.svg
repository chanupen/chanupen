    </linearGradient>
  </defs>
  <style>
    .name { font-family: Palatino, 'Palatino Linotype', 'Book Antiqua', 'URW Palladio L', Georgia, serif; font-size: 52px; fill: #1f2328; letter-spacing: 0.5px; }
